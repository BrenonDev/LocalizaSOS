<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LocalizaSOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html, body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
}

#loader{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:10;
}

.icon-wrapper{
  position:relative;
  width:120px;
  height:120px;
  margin-bottom:20px;
}

.risk-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:5px solid transparent;
  border-top:5px solid #fff;
  border-right:5px solid #fff;
  border-bottom:5px solid #fff;
  animation:spin 1.3s linear infinite;
}

.location-icon{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#e53935;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

#map-container{
  width:100%;
  height:100%;
  display:none;
}

iframe{
  width:100%;
  height:100%;
  border:0;
}

p{
  color:#ccc;
  text-align:center;
}
</style>
</head>

<body>

<div id="loader">
  <div class="icon-wrapper">
    <div class="risk-ring"></div>
    <div class="location-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" viewBox="0 0 16 16">
        <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/>
        <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
      </svg>
    </div>
  </div>
  <p><b>Localização recebida</b><br>Carregando o mapa…</p>
</div>

<div id="map-container"></div>

<script>
const params = new URLSearchParams(window.location.search);
const lat = params.get("lat");
const lon = params.get("lon");

if(!lat || !lon){
  document.querySelector("p").innerHTML = "Localização inválida.";
  throw new Error("Latitude ou longitude ausente.");
}

const mapUrl = `https://www.google.com/maps?q=${lat},${lon}&z=17&t=k&output=embed`;

setTimeout(()=>{
  document.getElementById("map-container").innerHTML =
    `<iframe src="${mapUrl}" allowfullscreen loading="lazy"></iframe>`;
  document.getElementById("loader").style.display = "none";
  document.getElementById("map-container").style.display = "block";
},2000);
</script>

</body>
</html>
